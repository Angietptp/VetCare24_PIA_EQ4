services:
  - type: web
    name: vetcare24
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vetcare24-db
          property: connectionString
databases:
  - name: vetcare24-db
    plan: free
    databaseName: vetcare24
